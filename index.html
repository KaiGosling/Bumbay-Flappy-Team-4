<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumbay Flappy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-root">

<!-- MENU -->
<div id="menu" class="screen">

    <div class="sky-bg">
        <div class="cloud" style="top:40px; left:30px;"></div>
        <div class="cloud" style="top:80px; left:220px; transform:scale(0.7)"></div>
        <div class="cloud" style="top:20px; left:310px; transform:scale(0.5)"></div>
        <div class="sun"></div>
    </div>

    <div class="menu-panel">

        <!-- LOGO -->
        <img
            src="assets/images/logo.png"
            alt="Bumbay Flappy"
            class="game-logo"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';"
        >
        <h1 id="logoFallback" style="display:none;">🐦 BUMBAY FLAPPY</h1>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="20"
        >

        <!-- DIFFICULTY -->
        <div class="difficulty-label">DIFFICULTY:</div>
        <div class="difficulty-buttons">
            <button class="btn-diff active" id="diff-easy"     onclick="setDifficulty('easy')">😊 EASY</button>
            <button class="btn-diff"        id="diff-medium"   onclick="setDifficulty('medium')">😤 MEDIUM</button>
            <button class="btn-diff"        id="diff-filipino" onclick="setDifficulty('filipino')">🇵🇭 FILIPINO</button>
        </div>

        <div class="buttons">
            <button class="btn-green"  onclick="startGame()">▶ START GAME</button>
            <button class="btn-yellow" onclick="openLeaderboard()">🏆 LEADERBOARD</button>
        </div>

    </div>

    <div class="ground-strip">
        <div class="grass-top"></div>
    </div>

    <p class="footer">Made by Team 4</p>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="screen hidden">

    <div class="sky-bg">
        <div class="cloud" style="top:40px; left:30px;"></div>
        <div class="cloud" style="top:20px; left:280px; transform:scale(0.6)"></div>
        <div class="sun"></div>
    </div>

    <div class="menu-panel">
        <img src="assets/images/logo.png" alt="Bumbay Flappy" class="game-logo" onerror="this.style.display='none';">
        <h2>🏆 LEADERBOARD</h2>
        <div id="scores"><p class="loading">Loading...</p></div>
        <button class="btn-green" onclick="backToMenu()">← BACK</button>
    </div>

    <div class="ground-strip">
        <div class="grass-top"></div>
    </div>

    <p class="footer">Made by Team 4</p>
</div>

<!-- GAME -->
<div id="gameScreen" class="hidden">
    <div class="game-wrapper">

        <!-- PAUSE BUTTON -->
        <button id="pauseBtn" class="btn-pause hidden" onclick="togglePause()">⏸ PAUSE</button>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- PAUSE OVERLAY -->
        <div id="pauseOverlay" class="hidden">
            <div id="pauseBox">
                <img src="assets/images/logo.png" alt="Bumbay Flappy" class="game-logo overlay-logo" onerror="this.style.display='none';">
                <h2>⏸ PAUSED</h2>
                <p class="pause-hint">Press <span>P</span> or click Resume</p>
                <div class="buttons">
                    <button class="btn-green"  onclick="resumeGame()">▶ RESUME</button>
                    <button class="btn-yellow" onclick="goToMenu()">🏠 MENU</button>
                </div>
            </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameOverOverlay" class="hidden">
            <div id="gameOverBox">
                <img src="assets/images/logo.png" alt="Bumbay Flappy" class="game-logo overlay-logo" onerror="this.style.display='none';">
                <h2>GAME OVER</h2>
                <p id="gameOverScore"></p>
                <div class="buttons">
                    <button class="btn-green"  onclick="restartGame()">▶ RESTART</button>
                    <button class="btn-yellow" onclick="goToMenu()">🏠 MENU</button>
                </div>
            </div>
        </div>

        <p class="footer">Made by Team 4</p>
    </div>
</div>

</div><!-- /#game-root -->

<!-- SCRIPTS (ORDER MATTERS!) -->
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/database.js"></script>
<script src="js/player.js"></script>
<script src="js/pipes.js"></script>
<script src="js/graphics.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
